# Plugin checks: engine tests on Mono and .NET (Linux), Python unit tests with a render through the engine and a git-only
# instrument download, doctor, an example render, and the same render with stems compared byte for byte between .NET and
# Mono (Linux) or .NET Framework (Windows, which also runs the unit tests on .NET Framework).
name: plugin
on:
  push:
  pull_request:
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NOTEWRIGHT_HOME: ${{ github.workspace }}/.notewright-home
      PYTHONUTF8: "1"
      NOTEWRIGHT_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Mono
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mono-devel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Cache compiler
        uses: actions/cache@v4
        with:
          path: .notewright-home/tools
          key: roslyn-4.8.0-${{ runner.os }}
      - name: Engine tests on Mono (playback fingerprints)
        if: runner.os == 'Linux'
        run: bash engine/run-tests.sh
      - name: Engine tests on .NET (playback fingerprints)
        if: runner.os == 'Linux'
        run: NOTEWRIGHT_RUNTIME=dotnet bash engine/run-tests.sh
      - name: Manifests
        run: python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
      - name: Unit tests (includes a render through the engine)
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: python notewright.py doctor
      - name: Render the built-in example
        run: python notewright.py render examples/pop.json --out out --stems --unity
      - name: Mono and .NET render the same WAV and stems
        if: runner.os == 'Linux'
        run: |
          NOTEWRIGHT_RUNTIME=dotnet python notewright.py render examples/pop.json --out out-dotnet --no-score --stems
          NOTEWRIGHT_RUNTIME=mono python notewright.py render examples/pop.json --out out-mono --no-score --stems --jobs 1
          for f in out-dotnet/*.wav out-dotnet/stems/*.wav; do cmp "$f" "out-mono/${f#out-dotnet/}"; done
      - name: Unit tests on .NET Framework
        if: runner.os == 'Windows'
        shell: bash
        run: NOTEWRIGHT_RUNTIME=netfx python -m unittest discover -s tests
      - name: .NET Framework and .NET render the same WAV and stems
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NOTEWRIGHT_RUNTIME=dotnet python notewright.py render examples/pop.json --out out-dotnet --no-score --stems
          NOTEWRIGHT_RUNTIME=netfx python notewright.py render examples/pop.json --out out-netfx --no-score --stems --jobs 1
          for f in out-dotnet/*.wav out-dotnet/stems/*.wav; do cmp "$f" "out-netfx/${f#out-dotnet/}"; done
